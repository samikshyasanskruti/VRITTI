
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vritti-backend
    ports:
      - "8001:8000"
    env_file:
      - backend/.env
    volumes:
      - ./data:/app/data
      - ./vector_store:/app/vector_store
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/frontend
      dockerfile: Dockerfile
    container_name: vritti-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
