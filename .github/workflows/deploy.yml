
name: Vritti CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check backend syntax
        run: python -m compileall -q backend/app

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend/frontend
        run: npm run build

      - name: Build backend Docker image
        run: docker build -f backend/Dockerfile -t vritti-backend:test .

      - name: Build frontend Docker image
        run: docker build -f Dockerfile -t vritti-frontend:test frontend/frontend
